name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - fix/sdl-activitythread-application

permissions:
  contents: read

jobs:
  build:
    # The checked-in StikJIT XCFramework was built with Swift 6.4.  The
    # macOS 15 image still defaults to Xcode 16.4/Swift 6.0, which cannot
    # parse that framework's module interface.
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore compiled dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/ios-arm64
            build/stamps
            third_party
          key: husk-ios-macos26-xcode26-${{ runner.arch }}-${{ hashFiles('scripts/sources.sh', 'scripts/build_*.sh', 'patches/*.patch') }}

      - name: Install build tools
        shell: bash
        run: |
          xcodebuild -version
          swift --version
          brew install meson ninja pkg-config xcodegen qemu
          rustup target add aarch64-apple-ios
          python3 -m pip install --break-system-packages pyyaml

          # build_gpu_ios.sh deliberately uses the Apple Silicon Homebrew path.
          # Keep the documented script unchanged when a hosted Intel runner is
          # selected by providing the same tool locations there.
          if [[ "$(uname -m)" == x86_64 ]]; then
            sudo mkdir -p /opt/homebrew/bin
            sudo ln -sf "$(command -v meson)" /opt/homebrew/bin/meson
            sudo ln -sf "$(command -v ninja)" /opt/homebrew/bin/ninja
          fi

      - name: Run SDL application-context regression test
        run: |
          python3 tests/translation-layer/test_jni_application.py
          python3 tests/translation-layer/test_sdl_relative_mouse.py
          python3 tests/translation-layer/test_sdl_native_runnable.py

      - name: Build and package ad-hoc signed IPA
        run: ./scripts/ci_build.sh build/Husk.ipa

      - name: Verify JIT and sideloading entitlements
        shell: bash
        run: |
          work="$(mktemp -d)"
          ditto -x -k build/Husk.ipa "$work"
          app="$work/Payload/Husk.app"
          codesign -d --entitlements :- "$app" > "$work/entitlements.plist"
          for entitlement in \
            get-task-allow \
            dynamic-codesigning \
            com.apple.developer.kernel.increased-memory-limit \
            com.apple.developer.kernel.extended-virtual-addressing; do
            /usr/libexec/PlistBuddy -c "Print :$entitlement" \
              "$work/entitlements.plist" >/dev/null
          done

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Husk-SDL-ActivityThread-fix
          path: build/Husk.ipa
          if-no-files-found: error
          retention-days: 30
